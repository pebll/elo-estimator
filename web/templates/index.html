<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elo Estimator - Guess Your Rating</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>♟ Elo Estimator</h1>
            <p class="subtitle">AI-powered rating prediction based on your moves</p>
        </header>

        <section class="search-section">
            <div class="search-box">
                <input type="text" id="username-input" placeholder="Enter Lichess username..." autocomplete="off">
                <button id="search-btn">Search</button>
            </div>
            <div id="error-message" class="error-message"></div>
        </section>

        <section id="games-section" class="games-section hidden">
            <h2>Recent Games for <span id="display-username"></span></h2>
            <div id="games-list" class="games-list"></div>
        </section>

        <div id="loading-overlay" class="loading-overlay hidden">
            <div class="loading-content">
                <div class="spinner"></div>
                <p id="loading-text">Analyzing game with Stockfish...</p>
                <p class="loading-subtitle">This may take 30-60 seconds</p>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>

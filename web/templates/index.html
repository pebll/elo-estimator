<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elo Estimator - Guess Your Rating</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>♟ Elo Estimator</h1>
            <p class="subtitle">AI-powered rating prediction based on your moves</p>
        </header>

        <section class="search-section">
            <div class="search-box">
                <input type="text" id="username-input" placeholder="Enter Lichess username..." autocomplete="off">
                <button id="search-btn">Search</button>
            </div>
            <div class="filters">
                <div class="filter-group">
                    <label for="variant-filter">Variant</label>
                    <select id="variant-filter">
                        <option value="standard">Standard</option>
                        <option value="chess960">Chess960</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="time-filter">Time Control</label>
                    <select id="time-filter">
                        <option value="all">All</option>
                        <option value="bullet">Bullet</option>
                        <option value="blitz">Blitz</option>
                        <option value="rapid">Rapid</option>
                        <option value="classical">Classical</option>
                    </select>
                </div>
            </div>
            <div id="error-message" class="error-message"></div>
        </section>

        <section id="results-section" class="results-section hidden">
            <div class="results-header">
                <h2>Recent Games for <span id="display-username"></span></h2>
                <div class="header-controls">
                    <button id="batch-analyze-btn" class="batch-btn">Analyze Next 10</button>
                    <div class="view-toggle">
                        <button id="list-view-btn" class="view-btn active">List</button>
                        <button id="graph-view-btn" class="view-btn">Graph</button>
                    </div>
                </div>
            </div>
            
            <div id="batch-progress" class="batch-progress hidden">
                <div class="progress-info">
                    <span id="progress-text">Analyzing game 1/10...</span>
                    <span id="progress-percent">0%</span>
                </div>
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
                <button id="batch-cancel-btn" class="cancel-btn">Cancel</button>
            </div>
            
            <div id="list-view" class="list-view">
                <div id="games-list" class="games-list"></div>
                <div class="load-more-container">
                    <button id="load-more-btn" class="load-more-btn hidden">Load More (+50)</button>
                </div>
            </div>
            
            <div id="graph-view" class="graph-view hidden">
                <div class="graph-container">
                    <canvas id="elo-chart"></canvas>
                </div>
                <div class="graph-legend">
                    <span class="legend-item"><span class="legend-color green"></span> Estimated ELO</span>
                    <span class="legend-item"><span class="legend-color blue"></span> True ELO</span>
                    <span class="legend-item"><span class="legend-color red"></span> Missing (interpolated)</span>
                    <span class="legend-divider"></span>
                    <label class="legend-toggle">
                        <input type="checkbox" id="toggle-raw" checked>
                        <span class="legend-line dotted"></span> Raw
                    </label>
                    <label class="legend-toggle">
                        <input type="checkbox" id="toggle-ma" checked>
                        <span class="legend-line solid"></span> MA(10)
                    </label>
                </div>
            </div>
        </section>

        <div id="loading-overlay" class="loading-overlay hidden">
            <div class="loading-content">
                <div class="spinner"></div>
                <p id="loading-text">Analyzing game with Stockfish...</p>
                <p class="loading-subtitle">This may take 30-60 seconds</p>
            </div>
        </div>
        
        <div id="queue-indicator" class="queue-indicator hidden">
            <span class="queue-icon">⏳</span>
            <span id="queue-count">0</span> in queue
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
